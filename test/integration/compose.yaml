# Databases and an SSH server for the integration tests (make integration). CI starts the same
# images, versions, credentials and ports as service containers (.github/workflows/ci.yml): keep both
# in sync. The credentials are throwaway values for these local containers only.
name: sqldoro-integration

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: sqldoro-root
      MYSQL_DATABASE: sqldoro
      MYSQL_USER: sqldoro
      MYSQL_PASSWORD: sqldoro-it
    ports: ["127.0.0.1:33306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usqldoro", "-psqldoro-it"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sqldoro
      POSTGRES_PASSWORD: sqldoro-it
      POSTGRES_DB: sqldoro
    ports: ["127.0.0.1:35432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sqldoro", "-d", "sqldoro"]
      interval: 2s
      timeout: 5s
      retries: 60

  # OpenSSH with TCP forwarding: the tests tunnel to mysql:3306 and postgres:5432 through it.
  ssh:
    image: testcontainers/sshd:1.3.0
    environment:
      PASSWORD: sqldoro-it
    ports: ["127.0.0.1:32222:22"]
