# Minimum risk level of a pull request, by the files it touches (added, changed, deleted or renamed).
# Read by the pr-writer agent (.claude/agents/pr-writer.md) and by scripts/risk.ts, which the "Risk label"
# workflow runs to check that the PR's risk:<level> label is not below the floor.
#
# Patterns are repository-relative globs (Node.js path.matchesGlob): `*` matches inside one path segment,
# `**` any number of segments, and neither matches a name starting with a dot, so dotfiles and dot folders
# are named explicitly. Levels: low, medium, high, critical.
# The other floor (any deploy step other than "None" is at least medium) depends on the PR description,
# so only the pr-writer agent applies it.
floors:
  # The checks themselves, what they run on and the agents that drive them.
  - category: pipeline config
    level: high
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - Makefile
      - lefthook.yml
      - eslint.config.ts
      - "**/tsconfig*.json"
      - vitest.config.ts
      - vitest.integration.config.ts
      - stryker.config.mjs
      - .dependency-cruiser.mjs
      - knip.jsonc
      - .prettierrc.json
      - .prettierignore
      - .vscodeignore
      - suppressions-baseline.json
      - scripts/**
      - test/setup.ts
      - test/webview/setup.ts
      - test/smoke/**
      - test/integration/compose.yaml
      - .github/**
      - .claude/**
      - CLAUDE.md
      - AGENTS.md

  # sqldoro runs no migrations of its own: its schema is what it keeps in VS Code's storage (connection
  # profiles, known hosts, history, saved queries, editor bindings, grid layouts) and the versioned
  # formats that read it back. A mistake there loses or corrupts what users saved.
  - category: storage schema
    level: high
    paths:
      - src/extension/storage/**
      - "**/*-store.ts"
      - src/extension/editor/bindings.ts
      - src/extension/tables/column-layouts.ts
      - src/extension/tables/query-box-height.ts
      - src/core/json/**
      - src/core/connection/codec.ts
      - src/core/history/history.ts
      - src/core/snippets/saved-queries.ts
      - src/core/editor/binding.ts
      - src/core/grid/saved-layouts.ts

  # Credentials, SecretStorage, certificate and host key verification, the SSH tunnel and the masking
  # of secrets in what sqldoro shows or logs.
  - category: auth and secrets
    level: high
    paths:
      # Any case: secrets.ts and SecretField.tsx alike
      - "**/*[aA]uth*"
      - "**/*[aA]uth*/**"
      - "**/*[sS]ecret*"
      - "**/*[sS]ecret*/**"
      - "**/*[cC]redential*"
      - "**/*[pP]assword*"
      - "**/*[pP]ermission*"
      - src/core/connection/tls.ts
      - src/core/session/**
      - src/tunnel/**
      - src/drivers/*/*-connection.ts
      - src/extension/connections/host-key-prompt.ts
      - src/extension/sessions/session-opener.ts
      - src/core/sql/redact-sql.ts

  # The locks between a user and a destructive statement: classification, guards, confirmations,
  # read-only mode, the automatic LIMIT, manual transactions, the statements generated for edits and
  # the dialect rules the classifier and the splitter rely on.
  - category: destructive SQL safety
    level: high
    paths:
      - src/core/safety/**
      - src/extension/safety/**
      - src/core/edits/**
      - src/extension/edits/**
      - src/core/sql/**
      - src/core/engine/dialect.ts
      - src/drivers/*/*-dialect.ts
      - src/drivers/mysql/mysql-strict-writes.ts
      - src/extension/editor/query-runner.ts
      - src/extension/transactions/**
