name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  # The release workflow runs the same gates on the release commit before it lands and drafts it.
  workflow_call:
    inputs:
      ref:
        description: >-
          The commit every job checks out (the release commit); empty checks out the commit that
          started the run, as on a pull request or a push.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Every analysis runs through `node scripts/quality-report.ts run <analysis> -- <command>`, which
# keeps the tool's exit code (the job is still the gate) and stores its output as a fragment. Each
# job uploads its fragments as the `quality-fragment-<job>` artifact, and the `quality-report` job
# at the end turns them into the single PR comment (marker <!-- quality-report -->), compared with
# the fragments of the last push run of this workflow on the PR's base branch. Later steps use
# `if: !cancelled()` so that one failure does not hide the results of the other analyses; the job
# still fails. See "Quality Report" in CONTRIBUTING.md to add an analysis.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The hygiene and contract checks compare a PR with its base branch
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: node scripts/quality-report.ts run eslint -- npm run lint
      - name: Format (Prettier)
        if: ${{ !cancelled() }}
        run: node scripts/quality-report.ts run prettier -- npm run format:check
      # Trailing whitespace and final newlines of every text file; on a PR also the files above
      # 500kb it adds (pre-commit's check-added-large-files), which needs the base branch's history.
      - name: File hygiene
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          node scripts/quality-report.ts run hygiene --
          npm run hygiene -- ${BASE_REF:+--base "origin/$BASE_REF"}
      # The public contract on a PR: the contributed commands, views, view containers and settings of
      # package.json must not lose anything they had at the merge base (CLAUDE.md, pre-PR checklist).
      - name: Public contract (package.json)
        if: ${{ !cancelled() && github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/quality-report.ts run contract -- npm run contract -- --base "origin/$BASE_REF"
      # Zero clones of 5 lines or 50 tokens in src/ and scripts/ (.jscpd.json), with no baseline.
      - name: Duplicated code (jscpd)
        if: ${{ !cancelled() }}
        run: node scripts/quality-report.ts run jscpd -- npm run duplication
      # Counts every suppression (eslint-disable, @ts-expect-error, coverage and mutation pragmas,
      # jscpd:ignore blocks, skipped tests...) and fails when it differs from suppressions-baseline.json.
      - name: Suppression ratchet
        if: ${{ !cancelled() }}
        run: node scripts/quality-report.ts run suppressions -- npm run suppressions

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-lint
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Types (tsc)
        run: node scripts/quality-report.ts run tsc -- npm run typecheck
      - name: Tests and coverage (Vitest)
        if: ${{ !cancelled() }}
        run: node scripts/quality-report.ts run vitest -- npm run test:coverage
      - name: Dead code (knip)
        if: ${{ !cancelled() }}
        run: node scripts/quality-report.ts run knip -- npm run dead-code
      - name: Dependency vulnerabilities (npm audit)
        if: ${{ !cancelled() }}
        run: node scripts/quality-report.ts run npm-audit -- npm run audit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-quality
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # The drivers and the SSH tunnel against real servers. The service containers use the images,
  # versions, throwaway credentials and ports of test/integration/compose.yaml (keep both in sync);
  # the SSH server reaches the databases by their service names, mysql and postgres.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: sqldoro-root
          MYSQL_DATABASE: sqldoro
          MYSQL_USER: sqldoro
          MYSQL_PASSWORD: sqldoro-it
        ports: ["33306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usqldoro -psqldoro-it"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sqldoro
          POSTGRES_PASSWORD: sqldoro-it
          POSTGRES_DB: sqldoro
        ports: ["35432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sqldoro -d sqldoro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      ssh:
        image: testcontainers/sshd:1.3.0
        env:
          PASSWORD: sqldoro-it
        ports: ["32222:22"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Integration tests (MySQL, PostgreSQL, SSH)
        run: node scripts/quality-report.ts run integration -- npm run test:integration

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-integration
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Architecture contracts (dependency-cruiser)
        run: node scripts/quality-report.ts run dependency-cruiser -- npm run lint:arch

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-architecture
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the two bundles and packs them into the .vsix a release would publish (vsce, reproducible:
  # the same commit always packs the same bytes), checks what the package holds and keeps it as the
  # sqldoro-vsix artifact, on pull requests and on main.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Build (esbuild, Vite)
        run: node scripts/quality-report.ts run build -- npm run build
      - name: Package (vsce)
        run: node scripts/quality-report.ts run package -- npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: sqldoro-vsix
          path: sqldoro-*.vsix
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-package
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Installs the package of the package job in a real VS Code (latest stable, downloaded by
  # @vscode/test-electron) under a virtual display: it must activate and register every command and
  # view it contributes.
  smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: sqldoro-vsix
      - name: Extension smoke (VS Code)
        run: node scripts/quality-report.ts run smoke -- xvfb-run -a npm run smoke

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-smoke
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Mutation testing lives in its own workflow (also run weekly and on demand); on PRs it is called
  # from here so that its result is part of this run and of the Quality Report.
  mutation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mutation.yml

  quality-report:
    if: always() && github.event_name == 'pull_request'
    needs: [lint, quality, integration, architecture, package, smoke, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads the fragments of the last run on the base branch (deltas and "inherited from" marks).
      actions: read
      # Minimum needed to upsert the PR comment. The token is read-only on PRs from forks: the
      # comment step then warns instead of failing, and the report stays in the job summary.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # The report script only uses Node.js built-ins: no npm ci needed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: quality-fragment-*
          merge-multiple: true
          path: quality-fragments

      # Best effort: the fragments of the last completed push run of this workflow on the base
      # branch, passed or failed. Without them (no run yet, artifacts past their 7 days, API error)
      # the report shows the deltas as n/a and marks no failure as inherited; it never fails
      # because of the baseline.
      - name: Download the base branch fragments
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_REF" \
            --event push --status completed --limit 20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].databaseId // empty') || run_id=""
          if [ -z "$run_id" ]; then
            echo "::notice::No completed run on $BASE_REF: the Quality Report has no baseline."
            exit 0
          fi
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'quality-fragment-*' --dir base-artifacts; then
            echo "::notice::Could not download the fragments of run $run_id (expired?): the Quality Report has no baseline."
            exit 0
          fi
          mkdir -p base-fragments
          find base-artifacts -name '*.json' -exec cp {} base-fragments/ \;
          echo "QUALITY_REPORT_BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Build report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALITY_REPORT_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/quality-report.ts render --needs-json "$NEEDS_JSON" \
            --base-dir base-fragments --base-name "$BASE_REF" --output quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('quality-report.md', 'utf8');
            const marker = '<!-- quality-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } catch (error) {
              core.warning(`Could not post the Quality Report comment (read-only token on fork PRs?): ${error.message}. The report is in the job summary.`);
            }
