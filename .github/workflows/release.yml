name: Release

# Actions -> Release -> Run workflow (from main), with the part of the version to raise or the exact
# version, releases sqldoro without a pull request or a local command:
#   prepare        chooses the version (refusing one that is tagged already, or an empty [Unreleased]
#                  in CHANGELOG.md), sets it in package.json and package-lock.json, dates its
#                  CHANGELOG.md section, checks the release, and commits it as github-actions[bot]
#                  ("chore: release X.Y.Z") to the branch release/vX.Y.Z, not to main.
#   gates          every gate of ci.yml, on that release commit.
#   draft          only once every gate passed: fast-forwards main to the release commit (never
#                  forced: if main moved meanwhile, it stops and leaves main alone), pushes the
#                  annotated tag vX.Y.Z on it, and attaches the .vsix the gates built and smoke-tested
#                  to a DRAFT GitHub release, with the CHANGELOG section as its notes.
#   cleanup        deletes release/vX.Y.Z, whatever happened.
# A failure before `draft` leaves main, the tags and the releases untouched. Nothing is published:
# the owner reviews the draft and publishes it by hand (see docs/RELEASING.md).
#
# What this workflow pushes with its GITHUB_TOKEN (the release branch, main, the tag) starts no
# workflow run: ci.yml does not run again on main, since the gates already passed on that commit.
#
# The fallback: a version tag pushed by hand (git push origin v1.2.3) releases that tag: `check`,
# the gates on it and `draft`, without touching main or tagging.
#
# Publishing the GitHub release then publishes the same .vsix to the VS Code Marketplace and to Open
# VSX, but only behind a manual switch that is off: the repository variable PUBLISH_EXTENSION must be
# "true", and the secrets VSCE_PAT and OVSX_PAT must exist (none of them does yet). The publish jobs
# run in the "publish" environment, where required reviewers can add a last approval.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: The part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or the exact version to release (X.Y.Z), which overrides the bump
        type: string
        required: false
        default: ""
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read

# One release at a time, never cancelled; publishing a release waits only for the same release.
concurrency:
  group: ${{ github.event_name == 'release' && format('release-publish-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release commit to its branch release/vX.Y.Z.
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      branch: ${{ steps.prepare.outputs.branch }}
      commit: ${{ steps.commit.outputs.commit }}
    env:
      BUMP: ${{ inputs.bump }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      # The release script only uses Node.js built-ins and git: no npm ci needed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Choose the version and date its CHANGELOG.md section
        id: prepare
        run: >-
          node scripts/release.ts prepare --ref "$GITHUB_REF" --bump "$BUMP"
          --version "$REQUESTED_VERSION"
      - name: Set the version of package.json and package-lock.json
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts
      - name: Check the tag, package.json and CHANGELOG.md
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: node scripts/release.ts check --tag "$TAG" --notes release-notes.md
      - name: Commit the release to its branch
        id: commit
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: node scripts/release.ts commit --tag "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # The fallback: a version tag pushed by hand.
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Check the tag, package.json and CHANGELOG.md
        id: check
        run: node scripts/release.ts check --tag "$GITHUB_REF_NAME" --notes release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  gates:
    needs: [prepare, check]
    # One of prepare and check is always skipped.
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.check.result == 'success') }}
    uses: ./.github/workflows/ci.yml
    with:
      # The release commit; empty for a pushed tag, whose commit started the run.
      ref: ${{ needs.prepare.outputs.commit }}
    # A called workflow gets no more than this. ci.yml's quality-report job asks to comment on pull
    # requests; it does not run here, but GitHub checks what it asks for anyway.
    permissions:
      contents: read
      pull-requests: write

  draft:
    needs: [prepare, check, gates]
    if: ${{ !cancelled() && needs.gates.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Fast-forwards main, pushes the tag, creates the draft release and uploads the .vsix to it.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IS_DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version || needs.check.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      VSIX: sqldoro-${{ needs.prepare.outputs.version || needs.check.outputs.version }}.vsix
    steps:
      # The .vsix the package job of the gates built from the release commit, which the smoke job
      # installed and tested.
      - uses: actions/download-artifact@v8
        with:
          name: sqldoro-vsix
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release
      - name: Check that the gates packaged this version
        run: |
          if [ ! -f "release/$VSIX" ]; then
            echo "::error::The gates did not package $VSIX: nothing was landed, tagged or drafted."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: env.IS_DISPATCHED == 'true'
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: repository
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: env.IS_DISPATCHED == 'true'
        with:
          node-version-file: repository/package.json
      # main moves only from the commit this run prepared the release on (GITHUB_SHA); the summary
      # says so when it moved meanwhile.
      - name: Fast-forward main to the release commit and tag it
        if: env.IS_DISPATCHED == 'true'
        working-directory: repository
        run: >-
          node scripts/release.ts land --tag "$TAG" --commit "$COMMIT" --base "$GITHUB_SHA"
      - name: Draft the release
        working-directory: release
        run: >-
          gh release create "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "sqldoro $VERSION" --notes-file release-notes.md
      - name: Summary
        working-directory: release
        run: |
          {
            echo "Drafted the release $TAG with $VSIX (sha256 $(sha256sum "$VSIX" | cut -d ' ' -f 1))."
            echo "Review it on GitHub, then publish it by hand. Nothing was published to a marketplace."
          } >> "$GITHUB_STEP_SUMMARY"

  # The release branch only carries the release commit to the gates: it goes, whatever happened.
  cleanup:
    needs: [prepare, draft]
    if: ${{ always() && needs.prepare.outputs.branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      # Deletes the branch release/vX.Y.Z.
      contents: write
    env:
      BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Delete the release branch
        run: node scripts/release.ts cleanup --branch "$BRANCH"

  # OFF until the owner sets the repository variable PUBLISH_EXTENSION to "true" and adds the
  # VSCE_PAT secret (docs/RELEASING.md). Runs when the GitHub release is published, with its .vsix.
  publish-marketplace:
    if: github.event_name == 'release' && vars.PUBLISH_EXTENSION == 'true'
    runs-on: ubuntu-latest
    environment: publish
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Check the tag, package.json and CHANGELOG.md
        run: node scripts/release.ts check --tag "$TAG"
      - name: Download the .vsix of the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "sqldoro-*.vsix"
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT secret is missing: see docs/RELEASING.md"
            exit 1
          fi
          npx vsce publish --packagePath sqldoro-*.vsix

  # OFF like publish-marketplace; needs the OVSX_PAT secret and the publisher's Open VSX namespace.
  publish-open-vsx:
    if: github.event_name == 'release' && vars.PUBLISH_EXTENSION == 'true'
    runs-on: ubuntu-latest
    environment: publish
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      # ovsx is not a dependency of the project: this pinned version runs only to publish.
      OVSX_VERSION: 1.2.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Check the tag, package.json and CHANGELOG.md
        run: node scripts/release.ts check --tag "$TAG"
      - name: Download the .vsix of the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "sqldoro-*.vsix"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::The OVSX_PAT secret is missing: see docs/RELEASING.md"
            exit 1
          fi
          npx --yes "ovsx@$OVSX_VERSION" publish sqldoro-*.vsix
